<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#070b12" />
    <meta name="description" content="904×572 纯 Canvas 牛顿色环色彩染缸互动原型。" />
    <title>牛顿色环 · 色彩染缸</title>
    <style>
      :root { color-scheme: dark; background: #070b12; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #070b12;
      }
      body {
        display: grid;
        place-items: center;
        padding: 0;
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      }
      main {
        width: min(100vw, calc(100vh * 1.58042));
        height: min(100vh, calc(100vw / 1.58042));
        max-width: 904px;
        max-height: 572px;
        overflow: hidden;
        border: 1px solid rgba(228, 238, 255, 0.12);
        border-radius: 18px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.46), 0 0 0 1px rgba(255, 255, 255, 0.025);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        cursor: crosshair;
        outline: none;
      }
      @media (max-width: 620px) {
        main { width: 100vw; height: auto; aspect-ratio: 904 / 572; border: 0; border-radius: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        canvas { cursor: default; }
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="scene" width="904" height="572" tabindex="0" role="img" aria-label="牛顿色环色彩染缸：点按取样、拖动搅拌、长按播撒选中的颜色"></canvas>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
